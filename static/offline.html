<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>离线 - BookStark</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #f9fafb;
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .offline-card {
            text-align: center;
            max-width: 400px;
            padding: 3rem 2rem;
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
        }
        .offline-icon {
            font-size: 3rem;
            color: #64748b;
            margin-bottom: 1.5rem;
        }
        .offline-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }
        .offline-desc {
            font-size: 14px;
            color: #64748b;
            line-height: 1.6;
            margin-bottom: 1.5rem;
        }
        .offline-btn {
            display: inline-block;
            padding: 0.5rem 1.5rem;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }
        .offline-btn:hover { background: #1d4ed8; }
        .offline-btn:focus-visible { outline: 2px solid #2563eb; outline-offset: 2px; }
    </style>
</head>
<body>
    <div class="offline-card">
        <div class="offline-icon">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="1" y1="1" x2="23" y2="23"></line>
                <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path>
                <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path>
                <path d="M10.71 5.05A16 16 0 0 1 22.56 9"></path>
                <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path>
                <path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path>
                <line x1="12" y1="20" x2="12.01" y2="20"></line>
            </svg>
        </div>
        <h1 class="offline-title">暂时无法连接 BookStark</h1>
        <p class="offline-desc">网络不可用、连接超时或服务暂时不可用，请稍后重试。为保护隐私，个人首页不会显示缓存的账号内容。</p>
        <button class="offline-btn" onclick="window.location.reload()">重试</button>
    </div>
</body>
</html>
