<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BookStark · 选择工作区</title>
<style>
:root{font:16px/1.55 system-ui,sans-serif;color:#202834;background:#f5f6f9;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(100%,720px)}
h1{font-size:clamp(1.85rem,5vw,2.6rem);margin:.45rem 0 1.4rem;letter-spacing:-.04em}
.brand{color:#3445a1;font-weight:750}
.options{display:grid;grid-template-columns:1fr 1fr;gap:16px}
section{background:white;border:1px solid #e0e4ed;border-radius:16px;padding:20px;display:flex;flex-direction:column}
section a:last-child,section form:last-child{margin-top:auto}
h2{font-size:1.15rem;margin:0 0 .5rem}p{margin:0 0 1rem;color:#4b566b}
label{display:block;font-size:.875rem;font-weight:650}
input{font:inherit;width:100%;padding:9px 11px;border:1px solid #aeb8cb;border-radius:8px;margin:5px 0 12px}
button,.action{display:block;width:100%;font:inherit;font-weight:650;text-decoration:none;text-align:center;cursor:pointer;padding:9px 12px;border-radius:8px;border:1px solid #394ab0;color:white;background:#394ab0}
.secondary{background:#fff;color:#394ab0}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #8394f1;outline-offset:2px}
.alert{border-left:3px solid #ab352d;background:#fff2f1;color:#812a23;padding:10px 12px}
.credential{user-select:all;overflow-wrap:anywhere;color:#242e45;background:#edf0fa;padding:10px;border-radius:6px}
.single{max-width:460px}
@media(max-width:600px){.options{grid-template-columns:1fr}body{place-items:start center}}
</style>
</head>
<body>
<main>
<span class="brand">BookStark</span>
{{if .FirstLogin}}
<h1>本地工作区已创建</h1>
<section class="single">
<p>使用以下本地管理员凭据登录。登录后可以在账户安全中修改密码。</p>
<p>账号 <code>admin</code></p>
<p>初始密码</p>
<p class="credential"><code>{{.FirstLogin}}</code></p>
<a class="action" href="/login">打开登录页</a>
</section>
{{else}}
<h1>选择工作区</h1>
{{if .Error}}<p class="alert" role="alert">{{.Error}}</p>{{end}}
<div class="options">
<section>
<h2>远程服务器</h2>
<p>连接已有的 BookStark。使用该服务器上的账号和数据。</p>
<form method="post" action="/__bookstark/remote">
<label for="address">服务器地址</label>
<input id="address" name="address" type="url" autocomplete="url" value="{{.Remote}}" placeholder="https://bookstark.example.com" required>
<button type="submit">连接服务器</button>
</form>
</section>
<section>
<h2>本地工作区</h2>
<p>数据库和附件保存在这台设备。笔记、文档和编辑器可以离线使用。</p>
<form method="post" action="/__bookstark/local">
<button class="secondary" type="submit">打开本地工作区</button>
</form>
</section>
</div>
{{end}}
</main>
</body>
</html>
