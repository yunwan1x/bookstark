                <figcaption class="note-image-lightbox-caption" id="shareNoteImageLightboxCaption"></figcaption>
            </figure>
            <button class="note-image-lightbox-nav note-image-lightbox-next" id="shareNoteImageLightboxNextBtn" type="button" onclick="showAdjacentShareImageLightbox(1)" aria-label="{{call .T "note.viewer.next"}}" title="{{call .T "note.viewer.next"}}"><i class="fa-solid fa-chevron-right"></i></button>
            <div class="note-image-lightbox-counter" id="shareNoteImageLightboxCounter">0 / 0</div>
        </div>
    </div>

    {{template "footer" .}}

    <script>
    window.__SHARE_COMMENTS_ENABLED__ = {{if .ShareCommentsEnabled}}true{{else}}false{{end}};
    window.__SHARE_COMMENT_ACCOUNT__ = {{jsonJS .Account}};
    window.__SHARE_COMMENT_MAX_LENGTH__ = {{.ShareCommentMaxLength}};
    </script>
    <script src="/static/js/share-comments.js?v={{assetVer "/static/js/share-comments.js"}}"></script>
    <script>
    /* ─── State ─── */
    var shareKeyword = '';
    var isAdmin = {{.IsAdmin}};
    var currentTab = 'latest';
    var PAGE_SIZE = { article: 15, note: 20, book: 12 };
    var tabState = {
        article: { page: 1, totalPages: 1, total: 0 },
        note:    { page: 1, totalPages: 1, total: 0 },
        book:    { page: 1, totalPages: 1, total: 0 }
    };
    var latestLoaded = false;
    var latestCache = { articles: [], books: [], notes: [] };
    var shareNoteStore = {};
    var shareNoteOrder = [];
    var shareNoteViewerCurrentKey = null;
    var shareImageLightboxIndex = null;
    var shareImageLightboxTrapHandler = null;
    var shareImageLightboxPrevFocus = null;
    var shareNoteViewerTrapHandler = null;
    var shareNoteViewerPrevFocus = null;

    /* ─── Markdown renderer (for notes) ─── */
    if (typeof marked !== 'undefined') {
        marked.setOptions({ breaks: true, gfm: true });
        var _renderer = new marked.Renderer();
        _renderer.code = function(obj) {
            var text = (typeof obj === 'object' && obj !== null) ? obj.text : obj;
            var lang = (typeof obj === 'object' && obj !== null) ? obj.lang : arguments[1];
            var escaped = typeof escHtml === 'function' ? escHtml(text) : String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
            if (lang) {
                var escapedLang = typeof escAttr === 'function' ? escAttr(lang) : String(lang).replace(/"/g,'&quot;');
                return '<div class="code-block" data-lang="'+escapedLang+'">' +
                    '<div class="code-block-header">' +
                    '<span class="code-block-dots"><i></i><i></i><i></i></span>' +
                    '<span class="code-block-lang">' + (typeof escHtml === 'function' ? escHtml(lang) : lang) + '</span>' +
                    '<button class="code-copy-btn" title="' + window.__('share.code.copy') + '" aria-label="' + window.__('share.code.copy') + '"><i class="fa-regular fa-copy"></i></button>' +
                    '</div><pre><code>' + escaped + '</code></pre></div>';
            }
            return '<pre><code>' + escaped + '</code></pre>';
        };
        marked.setOptions({ renderer: _renderer });
    }

    /* ─── Code copy ─── */
    document.addEventListener('click', function(e) {
        var btn = e.target.closest('.sh-note-text .code-copy-btn');
        if (!btn) return;
        var code = btn.closest('.code-block') && btn.closest('.code-block').querySelector('code');
        if (!code) return;
        var icon = btn.querySelector('i');
        var done = function() { if (icon) { icon.className = 'fa-solid fa-check'; setTimeout(function() { icon.className = 'fa-regular fa-copy'; }, 1200); } };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(code.textContent).then(done).catch(function() { if (typeof toast === 'function') toast(window.__('share.code.copy_error'), 'error'); });
        } else {
            var ta = document.createElement('textarea');
            ta.value = code.textContent; ta.style.cssText = 'position:fixed;opacity:0';
            document.body.appendChild(ta); ta.select();
            try { document.execCommand('copy'); done(); } catch(e) {}
            document.body.removeChild(ta);
        }
    });

    function resetShareNoteStore() {
        shareNoteStore = {};
        shareNoteOrder = [];
    }

    function registerShareNote(noteKey, note) {
        if (!noteKey) return;
        shareNoteStore[noteKey] = note;
        if (shareNoteOrder.indexOf(noteKey) < 0) shareNoteOrder.push(noteKey);
    }

    function copyTextToClipboard(text, successMessage) {
        var done = function() {
            if (window.BSDialog) BSDialog.toast(successMessage || window.__('note.toast.copied'), 'success');
        };
        var fail = function() {
            if (window.BSDialog) BSDialog.toast(window.__('note.code_copy_failed'), 'error');
        };
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done).catch(function() {
                var ta = document.createElement('textarea');
                ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
                document.body.appendChild(ta); ta.select();
                try { document.execCommand('copy'); done(); } catch(ex) { fail(); }
                document.body.removeChild(ta);
            });
            return;
        }
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.left = '-9999px';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); done(); } catch(ex) { fail(); }
        document.body.removeChild(ta);
    }

    function copyShareNoteContent(noteKey) {
        var note = shareNoteStore[noteKey];
        if (!note) return;
        copyTextToClipboard(note.content || '');
    }

    function copyShareNoteViewerContent() {
        if (!shareNoteViewerCurrentKey) return;
        copyShareNoteContent(shareNoteViewerCurrentKey);
    }

    function updateShareNoteViewerNav() {
        var idx = shareNoteOrder.indexOf(shareNoteViewerCurrentKey);
        var prevBtn = document.getElementById('shareNoteViewerPrevBtn');
        var nextBtn = document.getElementById('shareNoteViewerNextBtn');
        if (prevBtn) prevBtn.disabled = idx <= 0;
        if (nextBtn) nextBtn.disabled = idx < 0 || idx >= shareNoteOrder.length - 1;
    }

    function setShareNoteViewer(noteKey) {
        var note = shareNoteStore[noteKey];
        var titleEl = document.getElementById('shareNoteViewerTitle');
        var metaEl = document.getElementById('shareNoteViewerMeta');
        var contentEl = document.getElementById('shareNoteViewerContent');
        if (!note || !contentEl) return;
        shareNoteViewerCurrentKey = noteKey;
        if (titleEl) titleEl.textContent = note.title || window.__('share.type.note');
        if (metaEl) {
            var meta = [];
            if (note.author) meta.push(note.author);
            if (note.time) meta.push(fmtDate(note.time) + ' ' + fmtHM(note.time));
            if (note.labels && note.labels.length) meta.push(note.labels.join(' / '));
            metaEl.textContent = meta.join(' · ');
        }
        contentEl.innerHTML = typeof marked !== 'undefined'
            ? sanitizeRenderedHTML(marked.parse(note.content || ''))
            : escHtml(note.content || '');
        contentEl.scrollTop = 0;
        prepareShareNoteImages(contentEl);
        updateShareNoteViewerNav();
    }

    function openShareNoteViewer(noteKey) {
        var overlay = document.getElementById('shareNoteViewerOverlay');
        if (!overlay || !shareNoteStore[noteKey]) return;
        shareNoteViewerPrevFocus = document.activeElement;
        overlay.classList.add('active');
        if (window.BookStarkScrollLock) BookStarkScrollLock.lock('share-note-viewer');
        setShareNoteViewer(noteKey);
        trapShareNoteViewer(true);
    }

    function showAdjacentShareNoteViewer(delta) {
        var idx = shareNoteOrder.indexOf(shareNoteViewerCurrentKey);
        var nextKey = idx >= 0 ? shareNoteOrder[idx + delta] : null;
        if (!nextKey) return;
        setShareNoteViewer(nextKey);
    }

    function closeShareNoteViewer() {
        var overlay = document.getElementById('shareNoteViewerOverlay');
        if (overlay) overlay.classList.remove('active');
        var contentEl = document.getElementById('shareNoteViewerContent');
        if (contentEl) contentEl.innerHTML = '';
        shareNoteViewerCurrentKey = null;
        if (window.BookStarkScrollLock) BookStarkScrollLock.unlock('share-note-viewer');
        trapShareNoteViewer(false);
    }

    function prepareShareNoteImages(root) {
        root = root || document.getElementById('share-content');
        if (!root) return;
        var images = root.querySelectorAll('.sh-note-text img');
        Array.prototype.forEach.call(images, function(img) {
            if (img.dataset.shareLightboxReady === '1') return;
            img.dataset.shareLightboxReady = '1';
            img.classList.add('note-image-lightbox-trigger');
            img.setAttribute('tabindex', '0');
            img.setAttribute('role', 'button');
            img.setAttribute('aria-label', window.__('note.compose.image') || '查看图片');
            img.addEventListener('click', function(e) {
                e.preventDefault();
                e.stopPropagation();
                openShareImageLightbox(img);
            });
            img.addEventListener('keydown', function(e) {
                if (e.key !== 'Enter' && e.key !== ' ') return;
                e.preventDefault();
                e.stopPropagation();
                openShareImageLightbox(img);
            });
        });
    }

    function getShareImageLightboxItems() {
        var images = document.querySelectorAll('#share-content .sh-note-row .sh-note-text img.note-image-lightbox-trigger, #shareNoteViewerContent img.note-image-lightbox-trigger');
        return Array.prototype.slice.call(images).map(function(img, index) {
            return {
                img: img,
                src: img.currentSrc || img.src || img.getAttribute('src') || '',
                alt: img.getAttribute('alt') || '',
                title: img.getAttribute('title') || '',
                index: index
            };
        }).filter(function(item) { return !!item.src; });
    }

    function setShareImageLightboxItem(index) {
        var items = getShareImageLightboxItems();
        var overlayImg = document.getElementById('shareNoteImageLightboxImg');
        var captionEl = document.getElementById('shareNoteImageLightboxCaption');
        var counterEl = document.getElementById('shareNoteImageLightboxCounter');
        var prevBtn = document.getElementById('shareNoteImageLightboxPrevBtn');
        var nextBtn = document.getElementById('shareNoteImageLightboxNextBtn');
        if (!items.length || !overlayImg) {
            closeShareImageLightbox();
            return;
        }
        var nextIndex = Math.max(0, Math.min(index, items.length - 1));
        var item = items[nextIndex];
        shareImageLightboxIndex = nextIndex;
        overlayImg.src = item.src;
        overlayImg.alt = item.alt || item.title || '';
        if (captionEl) captionEl.textContent = item.alt || item.title || '';
        if (counterEl) counterEl.textContent = (nextIndex + 1) + ' / ' + items.length;
        if (prevBtn) prevBtn.disabled = nextIndex <= 0;
        if (nextBtn) nextBtn.disabled = nextIndex >= items.length - 1;
    }

    function openShareImageLightbox(targetImg) {
        var overlay = document.getElementById('shareNoteImageLightboxOverlay');
        if (!overlay || !targetImg) return;
        var items = getShareImageLightboxItems();
        var index = items.findIndex(function(item) { return item.img === targetImg; });
        if (index < 0) return;
        shareImageLightboxPrevFocus = document.activeElement;
        overlay.classList.add('active');
        if (window.BookStarkScrollLock) BookStarkScrollLock.lock('share-note-image-lightbox');
        setShareImageLightboxItem(index);
        trapShareImageLightbox(true);
    }

    function showAdjacentShareImageLightbox(delta) {
        var items = getShareImageLightboxItems();
        if (!items.length) return;
        var current = typeof shareImageLightboxIndex === 'number' ? shareImageLightboxIndex : 0;
        setShareImageLightboxItem(current + delta);
    }

    function closeShareImageLightbox() {
        var overlay = document.getElementById('shareNoteImageLightboxOverlay');
        if (overlay) overlay.classList.remove('active');
        var overlayImg = document.getElementById('shareNoteImageLightboxImg');
        if (overlayImg) {
            overlayImg.removeAttribute('src');
            overlayImg.alt = '';
        }
        shareImageLightboxIndex = null;
        if (window.BookStarkScrollLock) BookStarkScrollLock.unlock('share-note-image-lightbox');
        trapShareImageLightbox(false);
    }

    function trapShareNoteViewer(on) {
        if (on) {
            if (shareNoteViewerTrapHandler) return;
            shareNoteViewerTrapHandler = function(e) {
                if (e.key === 'Escape') { e.preventDefault(); closeShareNoteViewer(); return; }
                if (e.key === 'ArrowLeft') { e.preventDefault(); showAdjacentShareNoteViewer(-1); return; }
                if (e.key === 'ArrowRight') { e.preventDefault(); showAdjacentShareNoteViewer(1); return; }
            };
            document.addEventListener('keydown', shareNoteViewerTrapHandler);
            var closeBtn = document.querySelector('#shareNoteViewerOverlay .note-viewer-close');
            if (closeBtn) closeBtn.focus();
        } else {
            if (shareNoteViewerTrapHandler) {
                document.removeEventListener('keydown', shareNoteViewerTrapHandler);
                shareNoteViewerTrapHandler = null;
            }
            if (shareNoteViewerPrevFocus && typeof shareNoteViewerPrevFocus.focus === 'function') {
                try { shareNoteViewerPrevFocus.focus(); } catch(e) {}
                shareNoteViewerPrevFocus = null;
            }
        }
    }

    function trapShareImageLightbox(on) {
        if (on) {
            if (shareImageLightboxTrapHandler) return;
            shareImageLightboxTrapHandler = function(e) {
                if (e.key === 'Escape') { e.preventDefault(); closeShareImageLightbox(); return; }
                if (e.key === 'ArrowLeft') { e.preventDefault(); showAdjacentShareImageLightbox(-1); return; }
                if (e.key === 'ArrowRight') { e.preventDefault(); showAdjacentShareImageLightbox(1); return; }
            };
            document.addEventListener('keydown', shareImageLightboxTrapHandler);
            var closeBtn = document.getElementById('shareNoteImageLightboxCloseBtn');
            if (closeBtn) closeBtn.focus();
        } else {
            if (shareImageLightboxTrapHandler) {
                document.removeEventListener('keydown', shareImageLightboxTrapHandler);
                shareImageLightboxTrapHandler = null;
            }
            if (shareImageLightboxPrevFocus && typeof shareImageLightboxPrevFocus.focus === 'function') {
                try { shareImageLightboxPrevFocus.focus(); } catch(e) {}
                shareImageLightboxPrevFocus = null;
            }
        }
    }

    /* ─── Helpers ─── */
    function avatarColor(name) {
        var colors = ['avatar-c0','avatar-c1','avatar-c2','avatar-c3','avatar-c4','avatar-c5'];
        var h = 0; for (var i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
        return colors[Math.abs(h) % colors.length];
    }
    function avatarLetter(name) { return (name || '?').charAt(0).toUpperCase(); }
    function isSpecialDoc(docType) { return docType === 'spreadsheet' || docType === 'presentation' || docType === 'drawing' || docType === 'html' || docType === 'mindmap' || docType === 'richdoc'; }
    function docLabel(docType) { return { spreadsheet: window.__('share.type.spreadsheet'), presentation: window.__('share.type.presentation'), drawing: window.__('share.type.drawing'), html: 'HTML', mindmap: window.__('share.type.mindmap'), richdoc: window.__('share.type.richdoc') }[docType] || window.__('share.type.doc'); }
    function isNote(s) { return s.share_type === 'blog' && s.blog_type === 'note'; }
    function stripContent(text) {
        if (!text) return '';
        return text.replace(/<[^>]*>/g,'').replace(/!\[[^\]]*\]\([^)]*\)/g,'').replace(/\[([^\]]*)\]\([^)]*\)/g,'$1')
            .replace(/#{1,6}\s+/g,'').replace(/[*_]{1,3}([^*_\n]*)[*_]{1,3}/g,'$1')
            .replace(/`{1,3}[^`]*`{1,3}/g,'').replace(/>\s+/g,'').replace(/[-*+]\s+/g,'')
            .replace(/\d+\.\s+/g,'').replace(/---+/g,'').replace(/\n+/g,' ').trim();
    }
    function shareExcerpt(s) {
        if (!s) return '';
        if (s.has_password) return s.content || '';
        return stripContent(s.description || s.content || '');
    }
    function fmtTime(t) { if (!t) return ''; return t.substring(0, 16).replace('T', ' '); }
    function fmtDate(t) {
        if (!t) return '';
        var d = new Date(t); if (isNaN(d.getTime())) return t.substring(0, 10);
        var now = new Date();
        var diff = Math.floor((new Date(now.getFullYear(),now.getMonth(),now.getDate()) - new Date(d.getFullYear(),d.getMonth(),d.getDate())) / 86400000);
        if (diff === 0) return window.__('share.date.today'); if (diff === 1) return window.__('share.date.yesterday'); if (diff < 7) return diff + window.__('share.date.days_ago');
        return d.getFullYear() === now.getFullYear() ? (d.getMonth()+1) + window.__('share.date.month_day') + d.getDate() + window.__('share.date.day_unit') : d.getFullYear() + window.__('share.date.year_unit') + (d.getMonth()+1) + window.__('share.date.month_day') + d.getDate() + window.__('share.date.day_unit');
    }
    function fmtHM(t) {
        if (!t) return '';
        var d = new Date(t); if (isNaN(d.getTime())) return t.substring(11, 16);
        return d.getHours().toString().padStart(2,'0') + ':' + d.getMinutes().toString().padStart(2,'0');
    }
    var BOOK_COVERS = [
        'linear-gradient(135deg,#1e3a8a,#3b82f6)',
        'linear-gradient(135deg,#7c3aed,#a78bfa)',
        'linear-gradient(135deg,#065f46,#34d399)',
        'linear-gradient(135deg,#92400e,#f59e0b)',
        'linear-gradient(135deg,#9f1239,#fb7185)',
        'linear-gradient(135deg,#0c4a6e,#38bdf8)',
    ];
    function bookCover(name) {
        var h = 0; for (var i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
        return BOOK_COVERS[Math.abs(h) % BOOK_COVERS.length];
    }
    var BOOK_DOT_COLORS = ['#3b82f6','#7c3aed','#16a34a','#d97706','#e11d48','#0ea5e9'];
    function bookDotColor(name) {
        var h = 0; for (var i = 0; i < name.length; i++) h = name.charCodeAt(i) + ((h << 5) - h);
        return BOOK_DOT_COLORS[Math.abs(h) % BOOK_DOT_COLORS.length];
    }
    function typeAccentClass(s) {
        if (isNote(s)) return 't-note';
        if (s.share_type === 'book') return 't-book';
        return 't-blog';
    }
    function typeLabel(s) {
        if (s.share_type === 'book') return window.__('share.type.book');
        return isNote(s) ? window.__('share.type.note') : window.__('share.type.blog');
    }

    /* ─── Filter chip switching ─── */
    function switchFilter(chip, opts) {
        opts = opts || {};
        document.querySelectorAll('.sh-filter-chip').forEach(function(c) { c.classList.remove('active'); });
        chip.classList.add('active');
        currentTab = chip.dataset.tab;
        if (opts.updateUrl !== false && window.BookStarkTabURL) window.BookStarkTabURL.set('tab', currentTab);
        shareKeyword = '';
        document.getElementById('share-search').value = '';
        // search row visible only for non-latest tabs
        var searchRow = document.querySelector('.sh-search-row');
        searchRow.style.display = currentTab === 'latest' ? 'none' : '';
        if (currentTab === 'latest') {
            loadLatest();
        } else {
            loadTabPage(currentTab, 1);
        }
    }

    /* ─── Search ─── */
    function doShareSearch() {
        shareKeyword = document.getElementById('share-search').value.trim();
        if (currentTab !== 'latest') loadTabPage(currentTab, 1);
    }

    /* ─── "最新" tab: 3 parallel fetches ─── */
    function loadLatest() {
        document.getElementById('sharesPagination').innerHTML = '';
        if (latestLoaded) {
            renderLatest(latestCache.articles, latestCache.books, latestCache.notes);
            return;
        }
        var container = document.getElementById('share-content');
        container.innerHTML = document.getElementById('share-loading').innerHTML;
        Promise.all([
            fetch('/api/shares?type=article&page=1&page_size=10').then(function(r) { return r.json(); }),
            fetch('/api/shares?type=book&page=1&page_size=9').then(function(r) { return r.json(); }),
            fetch('/api/shares?type=note&page=1&page_size=50').then(function(r) { return r.json(); })
        ]).then(function(results) {
            if (currentTab !== 'latest') return;
            latestCache.articles = results[0].data || [];
            latestCache.books    = results[1].data || [];
            latestCache.notes    = results[2].data || [];
            renderLatest(latestCache.articles, latestCache.books, latestCache.notes);
            latestLoaded = true;
        }).catch(function() {
            if (currentTab !== 'latest') return;
            container.innerHTML = '<div class="sh-empty"><div class="sh-empty-icon"><i class="fa-solid fa-triangle-exclamation"></i></div><div class="sh-empty-text">'+window.__('share.load_error')+'</div></div>';
        });
    }

    function renderLatest(articles, books, notes) {
        var container = document.getElementById('share-content');
        resetShareNoteStore();
        if (!articles.length && !books.length && !notes.length) {
            container.innerHTML = '<div class="sh-empty"><div class="sh-empty-icon"><i class="fa-regular fa-folder-open"></i></div><div class="sh-empty-text">'+window.__('share.empty')+'</div></div>';
            return;
        }
        var html = '';

        // Hero: first pinned article
        var hero = null;
        var gridArticles = articles;
        if (articles.length > 0 && articles[0].is_pinned) {
            hero = articles[0];
            gridArticles = articles.slice(1);
        }
        if (hero) {
            var pPinBtn = '';
            var pExcerpt = shareExcerpt(hero);
            var pTags = (hero.labels && hero.labels.length) ? hero.labels.slice(0,4).map(function(l){return '<span class="sh-hero-tag">'+escHtml(l)+'</span>';}).join('') : '';
            var heroLetter = (hero.title||'?').charAt(0).toUpperCase();
            html += '<a class="sh-hero" href="/shares/'+escHtml(hero.share_identify)+'?from='+encodeURIComponent(location.pathname+location.search)+'">' +
                '<div class="sh-hero-cover"><div class="sh-hero-letter">'+escHtml(heroLetter)+'</div></div>' +
                '<div class="sh-hero-body">' +
                    '<div class="sh-hero-title-row"><span class="sh-hero-title">'+escHtml(hero.title)+'</span></div>' +
                    '<div class="sh-hero-excerpt">'+(pExcerpt ? escHtml(pExcerpt) : '<span style="color:var(--color-text-muted);font-style:italic">' + window.__('share.hero.no_text') + '</span>')+'</div>' +
                    '<div class="sh-hero-meta">' +
                        '<div class="sh-hero-avatar '+avatarColor(hero.author)+'">'+avatarLetter(hero.author)+'</div>' +
                        '<span>'+escHtml(hero.author)+'</span><span>·</span><span>'+fmtTime(hero.share_time)+'</span>' +
                        '<span class="sh-hero-badge" style="margin-left:4px"><span class="sh-pin-dot"></span>'+window.__('share.hero.pinned')+'</span>' +
                    '</div>' +
                    (pTags ? '<div class="sh-hero-tags">'+pTags+'</div>' : '') +
                '</div>' +
            '</a>';
        }

        if (gridArticles.length > 0) {
            html += '<div class="sh-sec"><span class="sh-sec-title">'+window.__('share.section.articles')+'</span><span class="sh-sec-line"></span><span class="sh-sec-count">'+gridArticles.length+' '+window.__('share.book_unit')+'</span></div>';
            html += '<div class="sh-grid">';
            gridArticles.forEach(function(s) { html += buildArticleCard(s); });
            html += '</div>';
        }
        if (books.length > 0) {
            var svgBook = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>';
            html += '<div class="sh-sec"><span class="sh-sec-title">'+window.__('share.section.books')+'</span><span class="sh-sec-line"></span><span class="sh-sec-count">'+books.length+' '+window.__('share.book_volume')+'</span></div>';
            html += '<div class="sh-book-grid">';
            books.forEach(function(s) { html += buildBookCard(s, svgBook); });
            html += '</div>';
        }
        if (notes.length > 0) {
            html += '<div class="sh-sec"><span class="sh-sec-title">'+window.__('share.section.notes')+'</span><span class="sh-sec-line"></span><span class="sh-sec-count">'+notes.length+' '+window.__('share.book_note_unit')+'</span></div>';
            html += '<div class="sh-note-feed">';
            notes.forEach(function(s) { html += buildNoteRow(s); });
            html += '</div>';
        }
        container.innerHTML = html;
        prepareShareNoteImages();
        initShareComments();
    }

    /* ─── Per-tab paginated load ─── */
    function loadTabPage(type, page) {
        var container = document.getElementById('share-content');
        container.innerHTML = document.getElementById('share-loading').innerHTML;
        document.getElementById('sharesPagination').innerHTML = '';
        var params = 'type=' + type + '&page=' + page + '&page_size=' + PAGE_SIZE[type];
        if (shareKeyword) params += '&keyword=' + encodeURIComponent(shareKeyword);
        var capturedTab = currentTab;
        fetch('/api/shares?' + params)
            .then(function(r) { return r.json(); })
            .then(function(d) {
                if (currentTab !== capturedTab) return; // tab switched, discard
                var items = d.data || [];
                var total = d.total || 0;
                var pageSize = PAGE_SIZE[type];
                var totalPages = Math.max(1, Math.ceil(total / pageSize));
                tabState[type].page = page;
                tabState[type].totalPages = totalPages;
                tabState[type].total = total;
                renderTabContent(type, items, page, totalPages, total);
                window.scrollTo({ top: 0, behavior: 'smooth' });
            })
            .catch(function() {
                if (currentTab !== capturedTab) return;
                container.innerHTML = '<div class="sh-empty"><div class="sh-empty-icon"><i class="fa-solid fa-triangle-exclamation"></i></div><div class="sh-empty-text">'+window.__('share.load_error')+'</div></div>';
            });
    }

    function renderTabContent(type, items, page, totalPages, total) {
        var container = document.getElementById('share-content');
        resetShareNoteStore();
        if (!items || items.length === 0) {
            container.innerHTML = '<div class="sh-empty"><div class="sh-empty-icon"><i class="fa-regular fa-folder-open"></i></div><div class="sh-empty-text">'+window.__('share.tab.empty')+'</div></div>';
            document.getElementById('sharesPagination').innerHTML = '';
            return;
        }
        var html = '';
        var secTitle = type === 'article' ? window.__('share.section.all_articles') : (type === 'book' ? window.__('share.section.all_books') : window.__('share.section.all_notes'));
        var unit = type === 'book' ? window.__('share.book_volume') : window.__('share.book_note_unit');
        html += '<div class="sh-sec"><span class="sh-sec-title">'+secTitle+'</span><span class="sh-sec-line"></span><span class="sh-sec-count">'+total+' '+unit+'</span></div>';

        if (type === 'article') {
            html += '<div class="sh-grid">';
            items.forEach(function(s) { html += buildArticleCard(s); });
            html += '</div>';
        } else if (type === 'book') {
            var svgBook = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,.85)" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></svg>';
            html += '<div class="sh-book-grid">';
            items.forEach(function(s) { html += buildBookCard(s, svgBook); });
            html += '</div>';
        } else if (type === 'note') {
            html += '<div class="sh-note-feed">';
            items.forEach(function(s) { html += buildNoteRow(s); });
            html += '</div>';
        }
        container.innerHTML = html;
        prepareShareNoteImages();
        initShareComments();
        renderPagination('sharesPagination', page, totalPages, function(p) {
            loadTabPage(type, p);
        }, { showCount: false });
    }

    /* ─── Card builders ─── */
    function buildArticleCard(s) {
        var pinBtn = isAdmin ? '<button class="sh-card-pin'+(s.is_pinned?' is-pinned':'')+'" onclick="event.preventDefault();togglePin(\''+s.share_type+'\','+s.target_id+',this)" aria-label="'+(s.is_pinned?window.__('share.unpin.title'):window.__('share.pin.title'))+'"><i class="fa-solid fa-thumbtack"></i></button>' : '';
        var docChip = isSpecialDoc(s.doc_type) ? '<span class="sh-type-chip">'+escHtml(docLabel(s.doc_type))+'</span>' : '';
        var typeChip = '<span class="sh-type-chip" style="margin-left:4px">'+escHtml(typeLabel(s))+'</span>';
        var excerpt = shareExcerpt(s);
        var tags = (s.labels && s.labels.length) ? s.labels.map(function(l) { return '<span class="tag-badge">'+escHtml(l)+'</span>'; }).join('') : '';
        return '<a class="sh-card" href="/shares/'+escHtml(s.share_identify)+'?from='+encodeURIComponent(location.pathname+location.search)+'">' +
            '<div class="sh-card-accent '+typeAccentClass(s)+'"></div>' +
            '<div class="sh-card-body">' +
                '<div class="sh-card-header"><div class="sh-card-title">'+escHtml(s.title)+'</div>'+pinBtn+'</div>' +
            '<div class="sh-card-excerpt">'+(excerpt ? escHtml(excerpt) : '<span class="sh-card-empty-excerpt">' + window.__('share.card.no_text') + '</span>')+'</div>' +
                '<div class="sh-card-footer">' +
                    '<div class="sh-card-avatar '+avatarColor(s.author)+'">'+avatarLetter(s.author)+'</div>' +
                    '<span>'+escHtml(s.author)+'</span><span>·</span><span>'+fmtTime(s.share_time).substring(5,10)+'</span>' +
                    typeChip + (docChip ? ' '+docChip : '') +
                    (s.has_password?'<i class="fa-solid fa-lock" style="opacity:.5;margin-left:4px"></i>':'') +
                    (tags ? '<div class="sh-card-tags">'+tags+'</div>' : '') +
                '</div>' +
            '</div>' +
        '</a>';
    }

    function buildBookCard(s, svgBook) {
        var dot = bookDotColor(s.title);
        return '<a class="sh-book-card" href="/shares/'+escHtml(s.share_identify)+'?from='+encodeURIComponent(location.pathname+location.search)+'">' +
            '<div class="sh-book-cover" style="background:'+bookCover(s.title)+'"><div class="sh-book-icon">'+svgBook+'</div></div>' +
            '<div class="sh-book-body"><div class="sh-book-title">'+escHtml(s.title)+'</div>' +
            '<div class="sh-book-meta"><span class="sh-book-count"><span class="sh-book-dot" style="background:'+dot+'"></span>'+s.doc_count+' '+window.__('share.book_unit')+'</span>' +
            '<span>'+fmtTime(s.share_time).substring(5,10)+'</span></div></div>' +
        '</a>';
    }

    function buildShareCommentsBlock(identify, extraClass) {
        if (!window.__SHARE_COMMENTS_ENABLED__ || !identify) return '';
        var classes = 'share-comments sh-note-comments' + (extraClass ? ' ' + extraClass : '');
        return '<section class="'+classes+'" data-share-identify="'+escAttr(identify)+'" data-comments-lazy="1" hidden data-comments-hydrated="0" aria-label="'+escAttr(window.__('share_comments.title'))+'"></section>';
    }

    function buildNoteRow(s) {
        var lock = s.has_password ? '<i class="fa-solid fa-lock" style="font-size:10px;color:var(--color-text-muted);margin-left:2px"></i>' : '';
        var tags = (s.labels && s.labels.length) ? '<div class="sh-note-tags">'+s.labels.slice(0,3).map(function(l){return '<span class="tag-badge">'+escHtml(l)+'</span>';}).join('')+'</div>' : '';
        var content = s.content || s.title || '';
        var rendered = typeof marked !== 'undefined'
            ? sanitizeRenderedHTML(marked.parse(content))
            : escHtml(content);
        var noteKey = 'share-note-' + (s.share_identify || s.target_id || s.id || shareNoteOrder.length);
        registerShareNote(noteKey, {
            title: s.title || window.__('share.type.note'),
            content: content,
            author: s.author || '',
            time: s.share_time || '',
            labels: s.labels || []
        });
        var noteKeyArg = noteKey.replace(/\\/g, '\\\\').replace(/'/g, "\\'");
        var commentAction = window.__SHARE_COMMENTS_ENABLED__ ? '<button type="button" class="sh-note-comment-btn note-comment-btn" onclick="event.stopPropagation();toggleShareNoteComments(this)" aria-expanded="false" aria-label="'+window.__('share_comments.title')+'" title="'+window.__('share_comments.title')+'"><i class="fa-regular fa-comments"></i></button>' : '';
        return '<div class="sh-note-row" data-note-key="'+escAttr(noteKey)+'">' +
            '<div class="sh-note-body">' +
                '<div class="sh-note-header"><span class="sh-note-author-tag">'+escHtml(s.author)+'</span><span class="sh-note-time">'+fmtDate(s.share_time)+' '+fmtHM(s.share_time)+lock+'</span><span class="sh-note-actions"><button type="button" class="sh-note-copy-btn note-copy-btn" onclick="event.stopPropagation();copyShareNoteContent(\''+noteKeyArg+'\')" aria-label="'+window.__('note.action.copy')+'" title="'+window.__('note.action.copy')+'"><i class="fa-regular fa-copy"></i></button>'+commentAction+'<button type="button" class="sh-note-fullscreen-btn note-fullscreen-btn" onclick="event.stopPropagation();openShareNoteViewer(\''+noteKeyArg+'\')" aria-label="'+window.__('note.action.fullscreen')+'" title="'+window.__('note.action.fullscreen')+'"><i class="fa-solid fa-expand"></i></button></span></div>' +
                '<div class="sh-note-text">'+rendered+'</div>' +
                tags +
                buildShareCommentsBlock(s.share_identify, 'sh-note-inline-comments') +
            '</div>' +
        '</div>';
    }

    function initShareComments() {
        if (window.BookStarkShareComments && typeof window.BookStarkShareComments.init === 'function') {
            BookStarkShareComments.init();
        }
    }

    function toggleShareNoteComments(btn) {
        var row = btn && btn.closest ? btn.closest('.sh-note-row') : null;
        var section = row ? row.querySelector('.share-comments') : null;
        if (!section) return;
        if (window.BookStarkShareComments && typeof window.BookStarkShareComments.toggle === 'function') {
            BookStarkShareComments.toggle(section, btn);
        }
    }

    /* ─── Pin toggle ─── */
    function togglePin(type, id, btn) {
        var request = window.BookStarkRequestLock
            ? BookStarkRequestLock.run('shares:pin:' + type + ':' + id, function() {
                return csrfFetch('/api/shares/' + type + '/' + id + '/pin', { method: 'PATCH' });
            }, btn)
            : csrfFetch('/api/shares/' + type + '/' + id + '/pin', { method: 'PATCH' });
        if (!request) return;
        request
        .then(function(r) { return r.json(); })
        .then(function(d) {
            if (d.code !== 0) { BSDialog.toast(d.message || window.__('share.pin.error'), 'error'); return; }
            BSDialog.toast(d.data && d.data.is_pinned ? window.__('share.pin.success') : window.__('share.unpin.success'), 'success');
            latestLoaded = false;
            latestCache = { articles: [], books: [], notes: [] };
            if (currentTab === 'latest') {
                loadLatest();
            } else {
                loadTabPage(currentTab, tabState[currentTab].page);
            }
        }).catch(function() { BSDialog.toast(window.__('share.pin.error'), 'error'); });
    }

    /* ─── Init ─── */
    var initialTab = window.BookStarkTabURL ? window.BookStarkTabURL.get('tab', ['latest', 'article', 'note', 'book'], 'latest') : 'latest';
    var initialChip = document.querySelector('.sh-filter-chip[data-tab="' + initialTab + '"]');
    if (initialChip && initialTab !== 'latest') {
        switchFilter(initialChip, { updateUrl: false });
    } else {
        document.querySelector('.sh-search-row').style.display = 'none';
        loadLatest();
    }
    </script>
</body>
</html>
