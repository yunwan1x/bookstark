<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v={{assetVer "/static/favicon.svg"}}">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>{{call .T "auth.reset.page_title"}}</title>
    <script>(function(){var k='bookstark-theme',s={light:'light',dark:'dark','notion-pro':'light','scholar-paper':'light','linear-saas':'dark','apple-minimal':'light'},t=localStorage.getItem(k);if(!s[t])t=window.matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',s[t]);document.documentElement.setAttribute('data-theme-style',t);})();</script>
    <link href="/static/css/tailwind.min.css?v={{assetVer "/static/css/tailwind.min.css"}}" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/variables.css?v={{assetVer "/static/css/variables.css"}}">
    <script src="/static/js/theme.js?v={{assetVer "/static/js/theme.js"}}"></script>
</head>
<body class="bg-slate-50">
<main role="main" class="min-h-screen flex items-center justify-center px-4 py-8">
    <section class="w-full max-w-[360px] bg-white border border-slate-200 rounded-lg p-6 sm:p-7" aria-labelledby="reset-title">
        <div class="mb-6">
            <a href="/login" class="inline-flex items-center text-sm text-slate-500 hover:text-blue-600 mb-5">&larr;&nbsp;{{call .T "auth.back_login"}}</a>
            <h1 id="reset-title" class="text-xl font-bold">{{call .T "auth.reset.heading"}}</h1>
            <p class="text-sm text-slate-500 mt-2 leading-6">{{call .T "auth.reset.description"}}</p>
        </div>
        {{if .Available}}
        <div id="error" class="hidden mb-4 p-3 bg-red-50 text-red-600 text-sm rounded" role="alert"></div>
        <div id="success" class="hidden mb-4 p-3 bg-green-50 text-green-700 text-sm rounded" role="status"></div>
        <form id="reset-form" onsubmit="completeReset(event)">
            <div class="mb-4">
                <label for="new-password" class="block text-sm font-medium mb-1.5">{{call .T "auth.reset.new_password"}}</label>
                <input id="new-password" type="password" minlength="6" maxlength="72" autocomplete="new-password" class="w-full px-3 py-2.5 border border-slate-300 rounded-md text-sm focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-600/20" placeholder="{{call .T "auth.field.password.min"}}" autofocus>
            </div>
            <div>
                <label for="confirm-password" class="block text-sm font-medium mb-1.5">{{call .T "auth.reset.confirm_password"}}</label>
                <input id="confirm-password" type="password" minlength="6" maxlength="72" autocomplete="new-password" class="w-full px-3 py-2.5 border border-slate-300 rounded-md text-sm focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-600/20" placeholder="{{call .T "auth.field.password.confirm.placeholder"}}">
            </div>
            <button id="submit-btn" type="submit" class="w-full mt-5 bg-blue-600 text-white py-2.5 rounded-md text-sm font-medium hover:bg-blue-700 disabled:opacity-60 disabled:cursor-not-allowed">{{call .T "auth.reset.submit"}}</button>
        </form>
        {{else}}
        <div class="p-3 bg-amber-50 text-amber-700 text-sm rounded">{{call .T "auth.forgot.unavailable"}}</div>
        {{end}}
    </section>
</main>
<script src="/static/js/i18n.js?v={{assetVer "/static/js/i18n.js"}}"></script>
<script>
window.__I18N_MESSAGES = {{.JSBundle}};
window.__currentLang = "{{.Lang}}";
let resetToken = '';
try {
    resetToken = new URLSearchParams(window.location.hash.slice(1)).get('token') || '';
    history.replaceState(null, '', window.location.pathname);
} catch (_) {}
const resetForm = document.getElementById('reset-form');
if (resetForm && !resetToken) {
    resetForm.classList.add('hidden');
    const error = document.getElementById('error');
    error.textContent = window.__('auth.reset.error.invalid');
    error.classList.remove('hidden');
}
async function completeReset(event) {
    event.preventDefault();
    const password = document.getElementById('new-password').value;
    const confirmPassword = document.getElementById('confirm-password').value;
    const error = document.getElementById('error');
    const success = document.getElementById('success');
    const button = document.getElementById('submit-btn');
    error.classList.add('hidden');
    if (password.length < 6) {
        error.textContent = window.__('auth.reset.error.short');
        error.classList.remove('hidden');
        return;
    }
    if (password !== confirmPassword) {
        error.textContent = window.__('auth.reset.error.mismatch');
        error.classList.remove('hidden');
        return;
    }
    button.disabled = true;
    try {
        const response = await fetch('/api/password/reset', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({token:resetToken,new_password:password,confirm_password:confirmPassword})});
        const data = await response.json();
        if (!response.ok) throw new Error(data.message || window.__('auth.reset.error.default'));
        success.textContent = window.__('auth.reset.success');
        success.classList.remove('hidden');
        resetForm.classList.add('hidden');
        setTimeout(function(){ window.location.href='/login'; }, 1600);
    } catch (err) {
        error.textContent = err.message || window.__('auth.reset.error.default');
        error.classList.remove('hidden');
    } finally {
        button.disabled = false;
    }
}
</script>
</body>
</html>
