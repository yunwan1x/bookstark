    <style>
        body { margin: 0; }
        .editor-full-height { height: 100vh; height: 100dvh; height: var(--editor-viewport-height, 100dvh); }
        .cherry { height: 100%; box-shadow: none !important; border: none !important; }
        #preview-area { min-height: 100%; }
        .cherry-previewer {
            padding: 45px 45px 20px 45px;
        }
        /* Preview-only: content flows naturally, single scrollbar from outer container */
        #preview-area .cherry { height: auto !important; }
        #preview-area .cherry-previewer { overflow-y: visible !important; min-height: auto !important; max-height: none !important; align-self: flex-start !important; }

        .tb-btn { display: inline-flex; align-items: center; padding: 3px 6px; border-radius: 4px; font-size: 13px; cursor: pointer; border: none; background: none; transition: background 0.15s; }
        .tb-btn:hover { background: var(--color-gray-100); }
        .tb-btn-danger { color: var(--color-danger); }
        .tb-btn-danger:hover { background: var(--color-danger-light); }
        .tb-btn-blue { color: var(--color-primary); }
        .tb-btn-blue:hover { background: var(--color-primary-light); }
        .tb-btn-slate { color: var(--color-gray-500); }
        .tb-btn-slate:hover { background: var(--color-gray-100); }
        .editor-back-btn { gap: 5px; padding-left: 8px; padding-right: 10px; font-weight: 600; }
        .editor-back-label { font-size: 12px; }
.tb-btn:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; border-radius: 4px; }
        .bs-dialog-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 9999; display: none; align-items: center; justify-content: center; }
        .bs-dialog-overlay.active { display: flex; }
        .bs-dialog-box { background: var(--color-bg-card); border-radius: var(--radius-xl); box-shadow: 0 8px 30px rgba(0,0,0,0.15); padding: var(--spacing-xl) 28px 20px; min-width: 320px; max-width: 420px; width: 420px; word-break: break-word; overflow-wrap: break-word; animation: bs-dialog-in 0.15s ease-out; }
        @keyframes bs-dialog-in { from { opacity: 0; transform: scale(0.95) translateY(-8px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .bs-dialog-title { font-size: 14px; color: var(--color-text); line-height: 1.6; margin-bottom: 20px; overflow-wrap: anywhere; }
        .bs-dialog-input-wrap { margin-bottom: 20px; }
        .bs-dialog-input { width: 100%; border: 1px solid var(--color-gray-300); border-radius: var(--radius-md); padding: 8px 12px; font-size: 14px; box-sizing: border-box; background: var(--color-white); color: var(--color-text); outline: none; transition: border-color 0.15s; }
        .bs-dialog-input:focus { border-color: var(--color-focus); box-shadow: 0 0 0 2px var(--color-focus-ring); }
        [data-theme="dark"] .bs-dialog-input { background: var(--color-gray-100); border-color: var(--color-gray-300); color: var(--color-text); }
        .bs-dialog-actions { display: flex; justify-content: flex-end; gap: var(--spacing-sm); }
        .bs-btn { padding: 6px 16px; border-radius: var(--radius-md); font-size: 13px; cursor: pointer; border: none; transition: background 0.15s; }
        .bs-btn-cancel { background: var(--color-gray-100); color: var(--color-gray-700); }
        .bs-btn-cancel:hover { background: var(--color-border); }
        .bs-btn-primary { background: var(--color-primary); color: white; }
        .bs-btn-primary:hover { background: var(--color-primary-hover); }
        @media (max-width: 640px) {
            .bs-dialog-overlay.active { align-items: flex-start; }
            .bs-dialog-box { width: 100% !important; min-width: 0; max-width: none !important; max-height: calc(var(--bs-vvh, 100dvh) - 8px) !important; overflow-y: auto; border-radius: 0 0 var(--radius-xl) var(--radius-xl); padding: 16px 20px 20px; animation: bs-dialog-slide-down 0.2s ease-out; scrollbar-width: none; -ms-overflow-style: none; }
            .bs-dialog-box::-webkit-scrollbar,
            .bs-dialog-box *::-webkit-scrollbar { display: none; }
        }
        @keyframes bs-dialog-slide-down { from { opacity: 0; transform: translateY(-20px); } to { opacity: 1; transform: translateY(0); } }
        .cherry .cherry-editor { padding: 0 !important; }
        .cherry .cherry-previewer { box-shadow: none !important; border: none !important; }
        
        @media (max-width: 768px) {
            #preview-area { padding-left: 0 !important; padding-right: 0 !important; max-width: 100% !important; margin: 0 !important;padding-bottom: 0; padding-top: 0; }
            #editor-area { padding: 0 !important; }
            .cherry .cm-editor .cm-content { padding: 1em !important; }
            .cherry .cherry-previewer  { padding: 1em !important; }
            .cherry { display: flex !important; flex-direction: column; }
            .cherry .cherry-toolbar { flex: none !important; }
            .cherry .cherry-editor { max-height: none !important; flex: 1 !important; min-height: 0; }
        }
        @media (max-width: 520px) {
            .editor-back-label { display: none; }
            .editor-back-btn { padding-left: 6px; padding-right: 6px; }
        }
    </style>
