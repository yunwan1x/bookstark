<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg?v={{assetVer "/static/favicon.svg"}}">
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#2563eb">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{call .T "meta.description"}}">
    <title>{{if .IsNew}}{{call .T "page.book_setting.new"}}{{else}}{{call .T "page.book_setting.edit"}}{{end}}</title>
    <link href="/static/css/tailwind.min.css?v={{assetVer "/static/css/tailwind.min.css"}}" rel="stylesheet">
{{template "head-assets" .}}
</head>
<body class="bg-slate-50 min-h-screen flex flex-col">
    {{template "header" .}}
    <main class="flex-1" role="main">
        <div class="max-w-[560px] mx-auto mt-6 md:mt-8 px-4">
            <div class="bg-white border border-slate-200 rounded-lg p-7">
                <h1 class="page-title mb-6">{{if .IsNew}}{{call .T "book.modal.new"}}{{else}}{{call .T "book.modal.edit"}}{{end}}</h1>
                <div id="error" class="hidden mb-4 p-3 bg-red-50 text-red-600 text-sm rounded"></div>
                <div class="mb-4">
                    <label for="book_name" class="block text-sm font-medium mb-1.5">{{call .T "book.field.name"}}</label>
                    <input id="book_name" type="text" class="w-full px-3 py-2 border border-slate-300 rounded-md text-sm" placeholder="{{call .T "book.field.name.placeholder"}}" value="{{if not .IsNew}}{{.Book.BookName}}{{end}}">
                </div>
                <div class="mb-4">
                    <label for="description" class="block text-sm font-medium mb-1.5">{{call .T "book.field.desc"}}</label>
                    <textarea id="description" class="w-full px-3 py-2 border border-slate-300 rounded-md text-sm h-20 resize-y" placeholder="{{call .T "book.field.desc.placeholder"}}">{{if not .IsNew}}{{.Book.Description}}{{end}}</textarea>
                </div>
                <div class="mb-6">
                    <label for="tag-input" class="block text-sm font-medium mb-1.5">{{call .T "book.field.tags"}}</label>
                    <div id="tag-container" class="flex gap-1.5 flex-wrap p-2 border border-slate-300 rounded-md min-h-[36px] items-center relative">
                        {{if .Labels}}{{range splitLabels .Labels}}<span class="bg-blue-50 text-blue-600 px-2 py-0.5 rounded text-xs flex items-center gap-1" data-tag="{{.}}">{{.}} <span class="cursor-pointer hover:text-red-500" onclick="removeTag(this)">×</span></span>{{end}}{{end}}
                        <input id="tag-input" type="text" class="border-none outline-none text-xs flex-1 min-w-[80px]" placeholder="{{call .T "book.tag.placeholder"}}" oninput="searchTags()" onkeydown="handleTagKey(event)" onfocus="searchTags()" autocomplete="off">
                        <div id="tag-dropdown" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-lg shadow-lg max-h-[200px] overflow-y-auto z-50"></div>
                    </div>
                </div>
                <div class="flex gap-3 justify-end">
                    <a href="/" class="px-4 py-2 border border-slate-300 rounded-md text-sm text-slate-500 hover:bg-slate-50">{{call .T "book.modal.cancel"}}</a>
                    <button onclick="saveBook(this)" class="px-4 py-2 bg-blue-600 text-white rounded-md text-sm hover:bg-blue-700">{{call .T "book.modal.save"}}</button>
                </div>
            </div>
        </div>
    </main>
    {{template "footer" .}}
    <script>
    var tagSearchTimer = null;
    function searchTags() {
        clearTimeout(tagSearchTimer);
        tagSearchTimer = setTimeout(async function() {
            var q = document.getElementById('tag-input').value.trim();
            var selected = getSelectedTags();
            var params = 'page_size=10';
            if (q) params += '&keyword=' + encodeURIComponent(q);
            var r = await fetch('/api/labels?' + params);
            var d = await r.json();
            var items = (d.data || []).filter(function(l) { return selected.indexOf(l.label_name) < 0; });
            var dd = document.getElementById('tag-dropdown');
            if (items.length === 0) {
                dd.innerHTML = q ? '<div class="px-3 py-2 text-xs text-slate-500">' + window.__('book.setting.tag.create_hint').replace('{name}', escHtml(q)) + '</div>' : '';
                dd.classList.toggle('hidden', !q);
            } else {
                dd.innerHTML = items.map(function(l) {
                    return '<div class="px-3 py-2 text-xs cursor-pointer hover:bg-blue-50 flex justify-between" data-label="' + escAttr(l.label_name) + '" onclick="addTag(this.dataset.label)"><span class="text-slate-700">' + escHtml(l.label_name) + '</span><span class="text-slate-500 ml-2">' + l.book_count + window.__('book.setting.tag.stat_books') + ' ' + l.blog_count + window.__('book.setting.tag.stat_blogs') + '</span></div>';
                }).join('');
                dd.classList.remove('hidden');
            }
        }, 300);
    }
    function handleTagKey(e) {
        if (e.key === 'Enter' || e.key === ',') {
            e.preventDefault();
            var i = document.getElementById('tag-input');
            var v = i.value.trim().replace(/,$/, '');
            if (!v) return;
            addTag(v);
        }
    }
    function addTag(name) {
        var selected = getSelectedTags();
        if (selected.indexOf(name) >= 0) return;
        var c = document.getElementById('tag-container');
        var i = document.getElementById('tag-input');
        var s = document.createElement('span');
        s.className = 'bg-blue-50 text-blue-600 px-2 py-0.5 rounded text-xs flex items-center gap-1';
        s.setAttribute('data-tag', name);
        s.innerHTML = escHtml(name) + ' <span class="cursor-pointer hover:text-red-500" onclick="removeTag(this)">×</span>';
        c.insertBefore(s, i);
        i.value = '';
        hideTagDropdown();
        searchTags();
    }
    function removeTag(el) { el.parentElement.remove(); }
    function hideTagDropdown() { document.getElementById('tag-dropdown').classList.add('hidden'); }
    function getSelectedTags() {
        var t = [];
        document.querySelectorAll('#tag-container > span[data-tag]').forEach(function(s) { t.push(s.getAttribute('data-tag')); });
        return t;
    }
    function getTags() { return getSelectedTags().join(','); }
    document.addEventListener('click', function(e) {
        if (!e.target.closest('#tag-container')) hideTagDropdown();
    });
    async function saveBook(btn){
        BookStarkErrors.clearField('error');
        const n=document.getElementById('book_name').value.trim();
        if(!n){BookStarkErrors.field('error', window.__('book.setting.error.no_name'));return;}
        const b={book_name:n,description:document.getElementById('description').value.trim(),labels:getTags()};
        try {
            {{if .IsNew}}const r=await csrfFetch('/api/books',{method:'POST',lockKey:'book:save:new',lockControl:btn,headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});{{else}}const r=await csrfFetch('/api/books/{{.Book.BookID}}',{method:'PUT',lockKey:'book:save:{{.Book.BookID}}',lockControl:btn,headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});{{end}}
            const d=await r.json();
            if(r.ok){ {{if .IsNew}}window.location.href='/books/'+(d.data.Identify||d.data.identify)+'/edit?from='+encodeURIComponent('/');{{else}}window.location.href='/';{{end}} }
            else{BookStarkErrors.field('error', d, window.__('book.setting.error.save_fail'));}
        } catch (err) {
            BookStarkErrors.field('error', err, window.__('book.setting.error.save_fail'));
        }
    }
    </script>
</body>
</html>
