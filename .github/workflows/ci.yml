# 常规 CI：每次 push / PR 跑一次本机编译，捕获语法/类型错误。
# 不做交叉编译矩阵以省 CI 时间，只确保主分支始终能构建。
name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    name: Build & vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: go vet
        run: go vet ./...

      - name: Build
        run: python3 build.py --build --output dist/bookstark

      - name: Native workspace setup tests
        run: go test -tags wails,gtk3,purego -run 'TestNativeWorkspaces|TestValidateServerURL|TestValidateLocalPassword' .

      - name: Standalone SSH tool WASM build
        run: python3 tools/ssh-terminal/build.py --output "${{ runner.temp }}/ssh-terminal"

      - name: Installed tool ZIP export regression
        run: go test ./controllers -run '^TestInstalledToolZIPExport' -count=1

      - name: Tool credential encryption and isolation
        run: go test ./internal/toolsecrets ./controllers -run 'TestCipher|TestConcurrentFirstWrite|TestToolSecrets|TestToolFileAPI|TestPublicTools' -count=1

      - name: SSH shell selection validation
        working-directory: tools/ssh-terminal
        run: go test ./internal/...

      - name: Setup Node for sandbox utility regression
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Sandboxed shared utility regression
        run: node --test tests/browser/sandbox_utils_test.cjs
