# 发布流水线：推 v* tag 时发布服务端二进制、GUI 客户端和 Docker 镜像。
# 也支持手动触发，用 workflow_dispatch 输入 tag 名。
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.01 or v0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
      stable: ${{ steps.meta.outputs.stable }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: meta
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ ]] || (( ${#RELEASE_TAG} > 128 )); then
            echo 'Expected a Docker-compatible version such as v0.01, v0.1.1 or v0.1.1-rc.1' >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)" || {
              echo 'Existing release tag does not match the selected source revision' >&2
              exit 1
            }
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_TAG" == *-* ]]; then STABLE=false; else STABLE=true; fi
          echo "stable=$STABLE" >> "$GITHUB_OUTPUT"

  server:
    name: Package standalone servers
    needs: prepare
    permissions:
      contents: write
    uses: ./.github/workflows/server-binaries.yml
    with:
      tag: ${{ needs.prepare.outputs.tag }}
      source_ref: ${{ github.sha }}

  client-desktop:
    name: Package BookStark client (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            runner: ubuntu-latest
            extension: zip
          - target: linux-amd64
            runner: ubuntu-latest
            extension: tar.gz
          - target: macos-universal
            runner: macos-latest
            extension: zip
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGET: ${{ matrix.target }}
      EXTENSION: ${{ matrix.extension }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build package
        shell: bash
        run: |
          mkdir -p dist client-stage
          BASE="bookstark-client-$VERSION-$TARGET"
          case "$TARGET" in
            macos-universal)
              python3 native/build_macos.py --out "dist/$BASE.zip"
              ditto -x -k "dist/$BASE.zip" client-stage
              lipo client-stage/BookStark.app/Contents/MacOS/BookStark -verify_arch arm64 x86_64
              codesign --verify --strict client-stage/BookStark.app
              ;;
            linux-amd64)
              GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
                -tags wails,production,gtk3,purego -ldflags="-s -w" -o client-stage/BookStark .
              cp native/README.md LICENSE client-stage/
              tar -czf "dist/$BASE.tar.gz" -C client-stage BookStark README.md LICENSE
              ;;
            windows-amd64)
              GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
                -tags wails,production -ldflags="-s -w -H windowsgui" -o client-stage/BookStark.exe .
              cp native/README.md LICENSE client-stage/
              (cd client-stage && zip -q "../dist/$BASE.zip" BookStark.exe README.md LICENSE)
              ;;
          esac
          (cd dist && shasum -a 256 "$BASE.$EXTENSION" > "$BASE.$EXTENSION.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: bookstark-client-${{ env.VERSION }}-${{ matrix.target }}
          path: dist/bookstark-client-${{ env.VERSION }}-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 7

  client-android:
    name: Package BookStark client (Android ${{ matrix.abi }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      ABI: ${{ matrix.abi }}
      NDK_VERSION: '28.2.13676358'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v4
        with:
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK packages
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK location is missing}}"
          sdkmanager --sdk_root="$SDK" "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Build and verify APK
        run: |
          BASE="bookstark-client-$VERSION-android-$ABI"
          python3 native/build_android.py --abi "$ABI" --out "dist/$BASE.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "dist/$BASE.apk"
          test "$(unzip -Z1 "dist/$BASE.apk" 'lib/*/libwails.so')" = "lib/$ABI/libwails.so"
          (cd dist && sha256sum "$BASE.apk" > "$BASE.apk.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: bookstark-client-${{ env.VERSION }}-android-${{ matrix.abi }}
          path: dist/bookstark-client-${{ env.VERSION }}-android-${{ matrix.abi }}.*
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Build and publish GHCR image
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.prepare.outputs.tag }}
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.stable }}
      - name: Build and push amd64/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=bookstark-image
          cache-to: type=gha,mode=max,scope=bookstark-image

  release:
    name: Publish Release
    needs: [prepare, server, client-desktop, client-android, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bookstark-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ needs.prepare.outputs.version }}
          make_latest: ${{ needs.prepare.outputs.stable }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.prepare.outputs.stable != 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            **BookStark clients** use Wails 3 and offer local workspaces and remote connections.
            Assets named `bookstark-client-*` include Windows x64, Linux x64,
            macOS Universal (Apple silicon and Intel), and Android ARM64 and x86_64.
            The macOS app uses ad-hoc signing. The Android APKs use test signing for sideloading.
            Local workspaces let you choose the admin password during first-time setup.
            The credentials screen includes a copy-password button.
            **Standalone servers:** `bookstark-VERSION-OS-ARCH` archives run without a GUI or Docker.
            Linux, macOS (darwin), and Windows are available for amd64 and arm64.
            Extract the archive and run the included executable; open the service in your browser.

            Docker image (linux/amd64, linux/arm64):
            ```sh
            docker pull ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}
            ```
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.apk
            dist/*.sha256
