# 发布流水线：推 v* tag 时多平台交叉编译并把产物挂到 GitHub Release。
# 也支持手动触发，用 workflow_dispatch 输入 tag 名。
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.01 or v0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      image: ${{ steps.meta.outputs.image }}
      stable: ${{ steps.meta.outputs.stable }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: meta
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?(-[A-Za-z0-9][A-Za-z0-9.-]*)?$ ]] || (( ${#RELEASE_TAG} > 128 )); then
            echo 'Expected a Docker-compatible version such as v0.01, v0.1.1 or v0.1.1-rc.1' >&2
            exit 1
          fi
          if git show-ref --verify --quiet "refs/tags/$RELEASE_TAG"; then
            test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)" || {
              echo 'Existing release tag does not match the selected source revision' >&2
              exit 1
            }
          fi
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_TAG" == *-* ]]; then STABLE=false; else STABLE=true; fi
          echo "stable=$STABLE" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            archive: tar.gz
          - goos: linux
            goarch: arm64
            archive: tar.gz
          - goos: darwin
            goarch: amd64
            archive: tar.gz
          - goos: darwin
            goarch: arm64
            archive: tar.gz
          - goos: windows
            goarch: amd64
            archive: zip
          - goos: windows
            goarch: arm64
            archive: zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Resolve tag & version
        id: meta
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          # 去掉前导 v 作为版本号（用于产物文件名内的版本字符串）
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # 二进制名（windows 自动 .exe）
          BIN="bookstark-${{ matrix.goos }}-${{ matrix.goarch }}"
          if [ "${{ matrix.goos }}" = "windows" ]; then BIN="$BIN.exe"; fi
          echo "bin=$BIN" >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          COMMIT: ${{ github.sha }}
        run: |
          python3 build.py --build \
            --tags timetzdata \
            --goos ${{ matrix.goos }} \
            --goarch ${{ matrix.goarch }} \
            --output dist/${{ steps.meta.outputs.bin }}

      - name: Stage release files
        id: stage
        run: |
          STAGE="dist/stage"
          PKG="bookstark-${{ steps.meta.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}"
          mkdir -p "$STAGE/$PKG"
          cp dist/${{ steps.meta.outputs.bin }} "$STAGE/$PKG/"
          # 附带 README / LICENSE（如存在）+ 默认配置参考
          for f in README.md readme.md LICENSE LICENSE.txt conf/app.conf; do
            [ -e "$f" ] && cp "$f" "$STAGE/$PKG/" || true
          done
          echo "pkg=$PKG" >> "$GITHUB_OUTPUT"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"

      - name: Archive (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd "${{ steps.stage.outputs.stage }}"
          tar -czf "${{ steps.stage.outputs.pkg }}.tar.gz" "${{ steps.stage.outputs.pkg }}"
          sha256sum "${{ steps.stage.outputs.pkg }}.tar.gz" > "${{ steps.stage.outputs.pkg }}.tar.gz.sha256"

      - name: Archive (zip)
        if: matrix.archive == 'zip'
        run: |
          cd "${{ steps.stage.outputs.stage }}"
          zip -qr "${{ steps.stage.outputs.pkg }}.zip" "${{ steps.stage.outputs.pkg }}"
          sha256sum "${{ steps.stage.outputs.pkg }}.zip" > "${{ steps.stage.outputs.pkg }}.zip.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.pkg }}
          path: |
            ${{ steps.stage.outputs.stage }}/${{ steps.stage.outputs.pkg }}.${{ matrix.archive }}
            ${{ steps.stage.outputs.stage }}/${{ steps.stage.outputs.pkg }}.${{ matrix.archive }}.sha256
          if-no-files-found: error
          retention-days: 7

  client-desktop:
    name: Package BookStark client (${{ matrix.target }})
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-amd64
            runner: ubuntu-latest
            extension: zip
          - target: linux-amd64
            runner: ubuntu-latest
            extension: tar.gz
          - target: macos-universal
            runner: macos-latest
            extension: zip
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TARGET: ${{ matrix.target }}
      EXTENSION: ${{ matrix.extension }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Build package
        shell: bash
        run: |
          mkdir -p dist client-stage
          BASE="bookstark-client-$VERSION-$TARGET"
          case "$TARGET" in
            macos-universal)
              python3 native/build_macos.py --out "dist/$BASE.zip"
              ditto -x -k "dist/$BASE.zip" client-stage
              lipo -verify_arch arm64 x86_64 client-stage/BookStark.app/Contents/MacOS/BookStark
              codesign --verify --strict client-stage/BookStark.app
              ;;
            linux-amd64)
              GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
                -tags wails,production,gtk3,purego -ldflags="-s -w" -o client-stage/BookStark .
              cp native/README.md LICENSE client-stage/
              tar -czf "dist/$BASE.tar.gz" -C client-stage BookStark README.md LICENSE
              ;;
            windows-amd64)
              GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath \
                -tags wails,production -ldflags="-s -w -H windowsgui" -o client-stage/BookStark.exe .
              cp native/README.md LICENSE client-stage/
              (cd client-stage && zip -q "../dist/$BASE.zip" BookStark.exe README.md LICENSE)
              ;;
          esac
          (cd dist && shasum -a 256 "$BASE.$EXTENSION" > "$BASE.$EXTENSION.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: bookstark-client-${{ env.VERSION }}-${{ matrix.target }}
          path: dist/bookstark-client-${{ env.VERSION }}-${{ matrix.target }}.*
          if-no-files-found: error
          retention-days: 7

  client-android:
    name: Package BookStark client (Android ${{ matrix.abi }})
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      ABI: ${{ matrix.abi }}
      NDK_VERSION: '28.2.13676358'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Build and verify APK
        run: |
          BASE="bookstark-client-$VERSION-android-$ABI"
          python3 native/build_android.py --abi "$ABI" --out "dist/$BASE.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "dist/$BASE.apk"
          test "$(unzip -Z1 "dist/$BASE.apk" 'lib/*/libwails.so')" = "lib/$ABI/libwails.so"
          (cd dist && sha256sum "$BASE.apk" > "$BASE.apk.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: bookstark-client-${{ env.VERSION }}-android-${{ matrix.abi }}
          path: dist/bookstark-client-${{ env.VERSION }}-android-${{ matrix.abi }}.*
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Build and publish GHCR image
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ needs.prepare.outputs.image }}
          flavor: latest=false
          tags: |
            type=raw,value=${{ needs.prepare.outputs.tag }}
            type=raw,value=${{ needs.prepare.outputs.version }}
            type=raw,value=latest,enable=${{ needs.prepare.outputs.stable }}
      - name: Build and push amd64/arm64
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=bookstark-image
          cache-to: type=gha,mode=max,scope=bookstark-image

  release:
    name: Publish Release
    needs: [prepare, build, client-desktop, client-android, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve tag
        id: meta
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: bookstark-*
          merge-multiple: true

      - name: List artifacts
        run: ls -la dist/

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ needs.prepare.outputs.version }}
          make_latest: ${{ needs.prepare.outputs.stable }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.prepare.outputs.stable != 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            **BookStark clients** use Wails 3 and offer local workspaces and remote connections.
            Assets named `bookstark-client-*` include Windows x64, Linux x64,
            macOS Universal (Apple silicon and Intel), and Android ARM64 and x86_64.
            The macOS app uses ad-hoc signing. The Android APKs use test signing for sideloading.
            The other ZIP and tar.gz archives contain the standalone BookStark server.

            Docker image (linux/amd64, linux/arm64):
            ```sh
            docker pull ${{ needs.prepare.outputs.image }}:${{ needs.prepare.outputs.tag }}
            ```
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.apk
            dist/*.sha256
