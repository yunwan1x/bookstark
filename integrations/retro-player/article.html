<body><main id="player" role="main">

<div class="tools library-path"><button id="rom-up" aria-label="Parent folder">↑</button><span id="rom-path"></span></div>
<div class="library-columns"><div id="rom-list" role="list" aria-label="ROM library"></div><aside id="rom-detail"><p class="eyebrow">GAME LIBRARY</p><h2 id="selected-rom" class="page-title"></h2><p id="rom-meta" class="hint"></p><p id="library-status" role="status" aria-live="polite"></p><progress id="rom-progress" hidden></progress><div class="tools"><button id="fetch-rom" class="primary" data-t="downloadRom"></button><button id="cancel-rom" hidden data-t="cancelBind"></button><button id="delete-rom" class="danger" data-t="deleteLocal"></button></div></aside></div>
