[package]
name = "bookstark-ssh-wasm"
version = "1.2.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
bytes = "1.7"
tokio = { version = "1", default-features = false, features = ["io-util", "sync"] }
gloo-timers = { version = "0.4", features = ["futures"] }
russh = { version = "0.65.4", default-features = false, features = ["ring", "rsa"] }
russh-sftp = { version = "4.0.0", default-features = false }
ring = { version = "0.17", features = ["wasm32_unknown_unknown_js"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "tls12"] }
rustls-pki-types = { version = "1", default-features = false, features = ["alloc"] }
webpki-roots = "0.26"
url = "2"
quick-xml = "0.37"
md-5 = "0.10"
sha2 = "0.10"
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = "debuginfo"
