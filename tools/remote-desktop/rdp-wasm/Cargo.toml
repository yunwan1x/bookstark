[package]
name = "bookstark-rdp-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
x509-cert = "0.2"
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom_04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
rustls = { version = "0.23", default-features = false, features = ["tls12"] }
rustls-rustcrypto = { version = "=0.0.2-alpha", default-features = false, features = ["alloc", "tls12", "zeroize"] }
rustls-pki-types = { version = "1", default-features = false, features = ["alloc"] }
ironrdp-core = "0.3"
ironrdp-pdu = "0.11"
ironrdp-connector = "0.12"
ironrdp-session = "0.13"
ironrdp-graphics = "0.11"
ironrdp-input = "0.9"
ironrdp-svc = "0.10"
ironrdp-dvc = "0.10"
ironrdp-cliprdr = "0.9"
ironrdp-rdpsnd = "0.11"
ironrdp-rdpdr = "0.9"
ironrdp-displaycontrol = "0.10"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
